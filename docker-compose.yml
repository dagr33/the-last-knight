services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://knight:${POSTGRES_PASSWORD:-knight_local_dev_only}@db:5432/last_knight
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: last_knight
      POSTGRES_USER: knight
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-knight_local_dev_only}"
    volumes:
      - knight_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knight -d last_knight"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      - 5432:542
volumes:
  knight_data:
