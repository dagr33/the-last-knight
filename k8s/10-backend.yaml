apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hw28
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: last-knight-backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: postgres://knight:knight_local_dev_only@postgres-service:5432/last_knight
            - name: COOKIE_SECURE
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: hw28
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
