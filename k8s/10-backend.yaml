apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: your-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: last-knight-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              value: postgres://knight:knight_local_dev_only@postgres-service:5432/last_knight
            - name: COOKIE_SECURE
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: your-project
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
